<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Ring Seat – Sections</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    padding: 16px;
  }

  .tree-item { position: relative; }

  .children {
    display: none;
    padding-left: 20px;
    position: relative;
  }
  .children::before {
    content: '';
    position: absolute;
    left: 7px; top: 0; bottom: 0;
    width: 1px; background: #e0e0e0;
  }
  .open > .children { display: block; }

  .row {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px;
    cursor: pointer;
    border-radius: 4px;
    user-select: none;
    position: relative;
  }
  .row:hover { background: #f5f5f5; }

  .children > .tree-item > .row::before {
    content: '';
    position: absolute;
    left: -13px; top: 50%;
    width: 13px; height: 1px;
    background: #e0e0e0;
  }

  .chevron {
    display: inline-block;
    width: 14px;
    text-align: center;
    font-size: 10px;
    color: #666;
    transition: transform .15s;
    flex-shrink: 0;
  }
  .open > .row .chevron { transform: rotate(90deg); }

  .folder-icon { font-size: 14px; flex-shrink: 0; }
  .label { color: #1a1a1a; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const DATA = {
  "Corners":  [1300,1301,1302,1303,1319,1320,1321,1322,1332,1333,1334,1335,1351,1352,1353,1354],
  "Gol Nord": [1023,1024,1025,1026,1027,1028,1029,1030,1031],
  "Gol Sud":  [1055,1056,1057,1058,1059,1060,1061,1062,1063]
};

function node(label, icon, childNodes) {
  const wrap = document.createElement('div');
  wrap.className = 'tree-item';

  const row = document.createElement('div');
  row.className = 'row';
  row.onclick = () => wrap.classList.toggle('open');

  const chev = document.createElement('span');
  chev.className = 'chevron';
  chev.textContent = '›';
  row.appendChild(chev);

  const ico = document.createElement('span');
  ico.className = 'folder-icon';
  ico.textContent = icon;
  row.appendChild(ico);

  const lbl = document.createElement('span');
  lbl.className = 'label';
  lbl.textContent = label;
  row.appendChild(lbl);

  wrap.appendChild(row);

  const children = document.createElement('div');
  children.className = 'children';
  childNodes.forEach(c => children.appendChild(c));
  wrap.appendChild(children);

  return wrap;
}

function leaf(label) {
  const wrap = document.createElement('div');
  wrap.className = 'tree-item';

  const row = document.createElement('div');
  row.className = 'row';
  row.style.cursor = 'default';

  const spacer = document.createElement('span');
  spacer.style.width = '14px';
  spacer.style.display = 'inline-block';
  row.appendChild(spacer);

  const ico = document.createElement('span');
  ico.className = 'folder-icon';
  ico.textContent = '📄';
  row.appendChild(ico);

  const lbl = document.createElement('span');
  lbl.className = 'label';
  lbl.textContent = label;
  row.appendChild(lbl);

  wrap.appendChild(row);
  return wrap;
}

function buildSeats() {
  const items = [];
  for (let i = 1; i <= 10; i++) {
    items.push(leaf(i + (i === 1 ? ' seat' : ' seats')));
  }
  return items;
}

function buildPayments() {
  return [1, 4, 6].map(n =>
    node(n + (n === 1 ? ' payment' : ' payments'), '📁', buildSeats())
  );
}

function buildTerms() {
  return [
    node('15 years', '📁', buildPayments()),
    node('30 years', '📁', buildPayments())
  ];
}

function buildRows() {
  return [
    node('1st Row', '📁', buildTerms()),
    node('Other Rows', '📁', buildTerms())
  ];
}

const root = document.getElementById('root');
Object.entries(DATA).forEach(([zone, sections]) => {
  root.appendChild(
    node(zone, '📁', sections.map(num =>
      node('Section ' + num, '📁', buildRows())
    ))
  );
});
</script>
</body>
</html>
